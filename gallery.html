<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Current and past exhibitions at Flashpoint — rotating outsider art shows at 1226 Tasker St, South Philadelphia. Always free." />
  <title>Gallery — Flashpoint</title>
  <link rel="canonical" href="https://flashpointphilly.com/gallery.html" />
  <link rel="manifest" href="/site.webmanifest" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Flashpoint" />
  <meta property="og:title" content="Gallery — Flashpoint" />
  <meta property="og:description" content="Rotating outsider art exhibitions at 1226 Tasker St, South Philadelphia. Always free." />
  <meta property="og:url" content="https://flashpointphilly.com/gallery.html" />
  <meta property="og:image" content="https://flashpointphilly.com/assets/images/og-image.jpg" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Gallery — Flashpoint" />
  <meta name="twitter:description" content="Rotating outsider art exhibitions at 1226 Tasker St, South Philadelphia. Always free." />
  <meta name="twitter:image" content="https://flashpointphilly.com/assets/images/og-image.jpg" />

  <!-- Base -->
  <link rel="stylesheet" href="css/base/variables.css" />
  <link rel="stylesheet" href="css/base/reset.css" />
  <link rel="stylesheet" href="css/base/typography.css" />
  <link rel="stylesheet" href="css/base/animations.css" />

  <!-- Components -->
  <link rel="stylesheet" href="css/components/nav.css" />
  <link rel="stylesheet" href="css/components/button.css" />
  <link rel="stylesheet" href="css/components/footer.css" />
  <link rel="stylesheet" href="css/components/audio-player.css" />
  <link rel="stylesheet" href="css/components/page-header.css" />

  <!-- Page -->
  <link rel="stylesheet" href="css/pages/gallery.css" />
</head>
<body>

  <!-- nav injected by nav.js -->

  <main class="main" id="main">

    <section class="page-header">
      <div class="page-header__inner">
        <span class="page-header__label text-label">Now Showing</span>
        <h1 class="page-header__title">Gallery</h1>
        <p class="page-header__sub text-label">Rotating exhibitions by outsider artists</p>
      </div>
    </section>

    <section class="exhibition">
      <div class="exhibition__image-wrap">
        <img class="exhibition__img" id="exhibition-img" src="assets/images/exhibition-placeholder.jpg" alt="Current exhibition" aria-hidden="true" />
        <div class="exhibition__overlay"></div>
        <div class="exhibition__caption">
          <span class="exhibition__dates text-label fp-load" id="exhibition-dates" style="--load-delay:200ms"></span>
          <h2 class="exhibition__title fp-load fp-load--hero" id="exhibition-title" style="--load-delay:350ms"></h2>
          <p class="exhibition__artist text-label fp-load" id="exhibition-artist" style="--load-delay:600ms"></p>
        </div>
      </div>
    </section>

    <section class="gallery-works">
      <div class="gallery-works__grid" id="works-grid"></div>
    </section>

    <section class="gallery-artist">
      <div class="gallery-artist__inner">
        <span class="gallery-artist__label text-label">About the Artist</span>
        <h2 class="gallery-artist__name" id="artist-name"></h2>
        <p class="gallery-artist__bio" id="artist-bio"></p>
        <a class="btn btn--outline" href="connect.html">Get in Touch</a>
      </div>
    </section>

    <section class="past-shows">
      <div class="past-shows__inner">
        <span class="past-shows__label text-label">Archive</span>
        <ul class="past-shows__list" id="past-shows-list"></ul>
      </div>
    </section>

  </main>

  <!-- Components -->
  <script src="js/components/nav.js"></script>
  <script src="js/components/footer.js"></script>
  <script src="js/components/audio-player.js"></script>
  <script src="js/utils/animate.js"></script>
  <script src="js/utils/seo.js"></script>

  <!-- Page -->
  <script src="js/pages/gallery.js"></script>
</body>
</html>
